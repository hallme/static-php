name: Build and deploy PHP binaries

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP version to build on all platforms
        type: choice
        required: true
        default: all
        options:
          - all
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
      platform:
        description: OS and CPU architecture to build
        type: choice
        required: true
        default: all
        options:
          - all
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64

permissions:
  contents: read

jobs:
  build:
    name: Build PHP ${{ matrix.php-version }} for ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(inputs.php_version != '' && inputs.php_version != 'all' && format('["{0}"]', inputs.php_version) || '["8.0","8.1","8.2","8.3","8.4","8.5"]') }}
        platform: ${{ fromJSON(inputs.platform != '' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["linux-x86_64","linux-aarch64","macos-x86_64","macos-aarch64"]') }}
    runs-on: ${{ matrix.platform == 'linux-x86_64' && 'ubuntu-24.04' || matrix.platform == 'linux-aarch64' && 'ubuntu-24.04-arm' || matrix.platform == 'macos-x86_64' && 'macos-15-intel' || 'macos-15' }}
    continue-on-error: ${{ matrix.php-version == '8.0' }}
    env:
      PHP_VERSION: ${{ matrix.php-version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build CLI and FPM binaries
        id: build
        shell: bash
        run: bash scripts/build.sh "$PHP_VERSION"

      - name: Show StaticPHP build errors
        if: failure()
        shell: bash
        run: |
          build_dir=".build/$PHP_VERSION-${{ matrix.platform }}"
          for log_file in "$build_dir/log/spc.shell.log" "$build_dir/log/spc.output.log" "$build_dir/console.log"; do
            if [[ -f "$log_file" ]]; then
              echo "Diagnostics from $log_file:"
              grep -n -E -i 'error:|fatal error:|syntax error|make(\[[0-9]+\])?: \*\*\*|undefined reference|undefined symbols|ld:|library .* not found|killed: 9' "$log_file" | tail -n 120 || true
              tail -n 60 "$log_file"
            fi
          done

      - name: Upload StaticPHP logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staticphp-logs-${{ matrix.php-version }}-${{ matrix.platform }}
          path: |
            .build/${{ matrix.php-version }}-${{ matrix.platform }}/log/
            .build/${{ matrix.php-version }}-${{ matrix.platform }}/console.log
            .build/${{ matrix.php-version }}-${{ matrix.platform }}/craft.yml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.cli_name }}
          path: .build/${{ matrix.php-version }}-${{ matrix.platform }}/dist/${{ steps.build.outputs.cli_name }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload FPM binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.fpm_name }}
          path: .build/${{ matrix.php-version }}-${{ matrix.platform }}/dist/${{ steps.build.outputs.fpm_name }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy binaries to server
    needs: build
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: php-*
          path: dist
          merge-multiple: true

      - name: Upload binaries over HTTP
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_URL:?Set DEPLOY_URL in repository secrets}"
          : "${DEPLOY_API_KEY:?Set DEPLOY_API_KEY in repository secrets}"

          for binary in dist/php-*; do
            echo "Uploading $(basename "$binary")"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
              -H "Authorization: Bearer ${DEPLOY_API_KEY}" \
              -F "file=@${binary};filename=$(basename "$binary")" \
              "$DEPLOY_URL"
          done
