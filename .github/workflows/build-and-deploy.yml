name: Build and deploy PHP binaries

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP version to build on all platforms
        type: choice
        required: true
        default: all
        options:
          - all
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
      platform:
        description: OS and CPU architecture to build
        type: choice
        required: true
        default: all
        options:
          - all
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64

permissions:
  contents: read

jobs:
  build:
    name: Build PHP ${{ matrix.php-version }} for ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(inputs.php_version != '' && inputs.php_version != 'all' && format('["{0}"]', inputs.php_version) || '["8.0","8.1","8.2","8.3","8.4","8.5"]') }}
        platform: ${{ fromJSON(inputs.platform != '' && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["linux-x86_64","linux-aarch64","macos-x86_64","macos-aarch64"]') }}
    runs-on: ${{ matrix.platform == 'linux-x86_64' && 'ubuntu-24.04' || matrix.platform == 'linux-aarch64' && 'ubuntu-24.04-arm' || matrix.platform == 'macos-x86_64' && 'macos-15-intel' || 'macos-15' }}
    continue-on-error: ${{ matrix.php-version == '8.0' }}
    env:
      PHP_VERSION: ${{ matrix.php-version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download StaticPHP CLI
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux-*) spc_os=linux ;;
            macos-*) spc_os=macos ;;
          esac
          spc_arch="${{ matrix.platform }}"
          spc_arch="${spc_arch#*-}"
          curl --fail --location --silent --show-error \
            "https://dl.static-php.dev/v3/spc-bin/nightly/spc-${spc_os}-${spc_arch}" \
            --output spc
          chmod +x spc

      - name: Install pkg-config on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pkgconf
          mkdir -p buildroot/bin buildroot/lib/pkgconfig
          ln -sf "$(brew --prefix pkgconf)/bin/pkgconf" buildroot/bin/pkg-config
          # Keep Homebrew fontconfig out of ImageMagick's static link dependencies.
          echo "PKG_CONFIG_PATH=$PWD/buildroot/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$PWD/buildroot/lib/pkgconfig" >> "$GITHUB_ENV"
          # PHP's static curl probe needs the macOS frameworks used by libcurl.
          echo "SPC_CMD_VAR_PHP_MAKE_EXTRA_LDFLAGS=-framework SystemConfiguration -framework CoreFoundation -framework CoreServices" >> "$GITHUB_ENV"
          buildroot/bin/pkg-config --version

      - name: Prepare build environment
        run: ./spc doctor --auto-fix

      - name: Select PHP version
        shell: bash
        run: |
          sed "s/^php-version:.*/php-version: \"${PHP_VERSION}\"/" craft.yml > craft-ci.yml
          mv craft-ci.yml craft.yml

      - name: Build PHP
        run: ./spc craft -v

      - name: Show StaticPHP build errors
        if: failure()
        shell: bash
        run: |
          for log_file in log/spc.shell.log log/spc.output.log; do
            if [[ -f "$log_file" ]]; then
              echo "Diagnostics from $log_file:"
              grep -n -E -i 'error:|fatal error:|make(\[[0-9]+\])?: \*\*\*|undefined reference|undefined symbols|ld:|library .* not found|killed: 9' "$log_file" | tail -n 120 || true
              tail -n 60 "$log_file"
            fi
          done

      - name: Upload StaticPHP logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staticphp-logs-${{ matrix.php-version }}-${{ matrix.platform }}
          path: log/
          if-no-files-found: warn
          retention-days: 7

      - name: Stage binary
        run: |
          mkdir -p dist
          install -m 0755 buildroot/bin/php "dist/php-${{ matrix.php-version }}-${{ matrix.platform }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.php-version }}-${{ matrix.platform }}
          path: dist/php-${{ matrix.php-version }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy binaries to server
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload binaries over HTTP
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_URL:?Set DEPLOY_URL in repository secrets}"
          : "${DEPLOY_API_KEY:?Set DEPLOY_API_KEY in repository secrets}"

          for binary in dist/php-*; do
            echo "Uploading $(basename "$binary")"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
              -H "Authorization: Bearer ${DEPLOY_API_KEY}" \
              -F "file=@${binary};filename=$(basename "$binary")" \
              "$DEPLOY_URL"
          done
